# One-click publishing: Actions tab -> "Publish MCP server" -> Run workflow.
# Publishes three separate MCP Registry listings (Public Domain Check, Sanctions Check, Property Risk Check)
# and, if the repo has an NPM_TOKEN secret, the npm desktop add-on first.
name: Publish MCP server
on: workflow_dispatch
permissions:
  id-token: write
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: Publish npm package (only if NPM_TOKEN is set)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "No NPM_TOKEN secret: listing the remote MCP servers only."
            exit 0
          fi
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION is already on npm."
          else
            npm publish --access public
          fi
          echo "Waiting for npm to show $NAME@$VERSION..."
          for i in $(seq 1 30); do
            if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then echo "Visible on npm."; break; fi
            sleep 10
          done
          cp server.with-npm.json server.json
      - name: Install mcp-publisher
        run: |
          curl -sL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
      - name: Publish to MCP Registry (one listing per product)
        run: |
          ./mcp-publisher login github-oidc
          echo "== Public Domain Check"
          ./mcp-publisher publish
          for d in servers/*/; do
            echo "== $d"
            (cd "$d" && "$GITHUB_WORKSPACE/mcp-publisher" publish)
          done
